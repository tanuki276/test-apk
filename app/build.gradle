// Top-level plugins definition
plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// Public application endpoint, confirmed from the successful deployment workflow.
// Keep overrides for staging and deployments; blank CI variables must not disable generation.
def localConfig = new Properties()
def localConfigFile = rootProject.file("local.properties")
if (localConfigFile.exists()) localConfigFile.withInputStream { localConfig.load(it) }
def aiProxyUrl = [providers.gradleProperty("AI_PROXY_URL").orNull,
                  providers.environmentVariable("AI_PROXY_URL").orNull,
                  localConfig.getProperty("AI_PROXY_URL"),
                  "https://liefantidia2-ai-router.light06120602.workers.dev/generate-recipe"]
        .find { it != null && !it.trim().isEmpty() }.trim()

android {
    namespace 'com.example.liefantidia2'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.liefantidia2"
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName "1.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 本番URLは CI の -PAI_PROXY_URL または環境変数で指定する。
        // 秘密鍵は絶対にAPKへ入れない。
        buildConfigField "String", "AI_PROXY_URL", groovy.json.JsonOutput.toJson(aiProxyUrl)
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

tasks.configureEach { task ->
    if (task.name == "preBuild") {
        task.doFirst {
            def endpoint = new URI(aiProxyUrl)
            if (endpoint.scheme != "https" || !endpoint.host || endpoint.host == "example.workers.dev"
                    || endpoint.path != "/generate-recipe" || endpoint.userInfo || endpoint.fragment || endpoint.query) {
                throw new GradleException("Build requires a valid HTTPS AI_PROXY_URL ending in /generate-recipe")
            }
        }
    }
}
