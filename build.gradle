// Top-level build file where you can add configuration options common to all sub-projects/modules.

// settings.gradle にプラグインバージョンが移行できないため、buildscriptブロックは残します。
buildscript {
    ext {
        // Kotlinのバージョンを明示的に定義
        kotlin_version = '1.9.0' 

        // Android Gradle Plugin (AGP) のバージョンを定義
        agp_version = '8.10.1'
        
        // Google Servicesプラグインのバージョンを定義
        gms_plugin_version = '4.4.0' // 現在の安定版を使用
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGPを依存関係として定義
        classpath "com.android.tools.build:gradle:$agp_version"
        // Kotlinプラグインを依存関係として定義
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        
        // Google Services プラグインのクラスパスを定義
        classpath "com.google.gms:google-services:$gms_plugin_version" 
    }
}

// 🚨 修正: 以前クラッシュを引き起こしていた allprojects { repositories { ... } } ブロックを削除しました。
// 🚨 修正: Gradle 8.0+ のエラーを避けるため、pluginManagement と dependencyResolutionManagement を削除しました。

task clean(type: Delete) {
    delete rootProject.buildDir
}

// NOTE: pluginManagement と dependencyResolutionManagement は settings.gradle に移動されます。

// rootProject.name と include は settings.gradle に存在するため、ここでは不要ですが、
// プロジェクトファイルの全体的な整合性を保つため、settings.gradleの内容も確認・修正します。