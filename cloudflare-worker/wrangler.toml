name = "liefantidia2-ai-router"
main = "src/index.js"
compatibility_date = "2026-10-01"

[ai]
binding = "AI"

[vars]
FIREBASE_PROJECT_ID = "liefantidia2"
HIGH_PROVIDER_ORDER = "groq,gemini,workers"
GROQ_HIGH_MODEL = "openai/gpt-oss-120b"
GEMINI_HIGH_MODEL = "gemini-3.8-flash"
WORKERS_AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"

GUEST_NORMAL_DAILY_LIMIT = "5"
USER_NORMAL_DAILY_LIMIT = "20"
USER_HIGH_DAILY_LIMIT = "10"
GLOBAL_DAILY_LIMIT = "500"

[[durable_objects.bindings]]
name = "GENERATION_BUDGET"
class_name = "GenerationBudget"

[[migrations]]
tag = "v1-generation-budget"
new_sqlite_classes = ["GenerationBudget"]
