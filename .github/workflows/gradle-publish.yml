name: Gradle パッケージ

on:
  # メイントリガー: GitHubリポジトリで新しいリリースが作成されたときに実行
  release:
    types: [created]
  
  # ★トラブルシューティング/デバッグ用に追加: Actionsタブから手動で実行可能にする
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: JDK 17のセットアップ
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # キャッシュを有効にし、ビルド速度を向上させる
          cache: 'gradle'

      - name: gradlew に実行権限を付与
        run: chmod +x ./gradlew

      # ----------------------------------------------------
      # ビルドタスクの実行
      # ----------------------------------------------------
      - name: リリースAPKのビルド (assembleRelease)
        # エンドユーザー向けの配布物（APK）を生成するタスクを実行
        run: ./gradlew assembleRelease -PAI_PROXY_URL="${{ vars.AI_PROXY_URL }}" --stacktrace --info

      # ----------------------------------------------------
      # 成果物のアップロード
      # ----------------------------------------------------
      - name: リリースAPKの成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: CookAi-release-apk
          # 🟢 APKの格納場所である app/build/outputs/apk/release/ を指定
          path: app/build/outputs/apk/release/
          # 成果物を保持する期間
          retention-days: 7

