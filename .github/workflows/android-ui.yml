name: Android UI and cooking preferences
on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - run: npm ci
        working-directory: tests/firestore
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: chmod +x gradlew
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put system font_scale 1.3
            tests/firestore/node_modules/.bin/firebase emulators:exec --project demo-cookai --only auth,firestore './gradlew connectedDebugAndroidTest --no-daemon --max-workers=2'
            adb pull /sdcard/Android/data/com.example.liefantidia2/files/ui ui-captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CookAi-ui-checks
          path: |
            ui-captures/
            app/build/reports/androidTests/
          if-no-files-found: warn
