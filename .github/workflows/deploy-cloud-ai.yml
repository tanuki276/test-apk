name: Cloud AI 配備 + 使用可能APKビルド

on:
  push:
    branches: [fix/history-quota-settings]
  workflow_dispatch:

jobs:
  deploy-and-build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SKIP_JDK_VERSION_CHECK: true

    steps:
      - name: 1. リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 2. Cloudflare認証情報を確認
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を Repository Secrets に設定してください。" >&2
            exit 1
          fi

          if [ -z "${GROQ_API_KEY:-}" ] && [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "注意: GROQ_API_KEY / GEMINI_API_KEY が未設定です。高精度モードは Workers AI のみで動作します。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 3. Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 4. Worker依存関係をインストール
        working-directory: cloudflare-worker
        run: npm ci

      - name: 5. Cloudflare Workerをデプロイ
        working-directory: cloudflare-worker
        run: npx wrangler deploy

      - name: 6. 高精度AI用Secretを設定
        working-directory: cloudflare-worker
        shell: bash
        run: |
          set -euo pipefail

          configured=0
          if [ -n "${GROQ_API_KEY:-}" ]; then
            printf '%s' "$GROQ_API_KEY" | npx wrangler secret put GROQ_API_KEY
            echo "- Groq: configured" >> "$GITHUB_STEP_SUMMARY"
            configured=$((configured + 1))
          else
            echo "- Groq: not configured" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "${GEMINI_API_KEY:-}" ]; then
            printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
            echo "- Gemini: configured" >> "$GITHUB_STEP_SUMMARY"
            configured=$((configured + 1))
          else
            echo "- Gemini: not configured" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$configured" -eq 0 ]; then
            echo "高精度モードは Workers AI のみを使用します。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "高精度モード用の外部AI Secretを ${configured} 件設定しました。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 7. Worker URLを取得して疎通確認
        id: worker
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")

          SUBDOMAIN=$(printf '%s' "$RESPONSE" | node -e '
            let s="";
            process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => {
              const j = JSON.parse(s);
              if (!j.success || !j.result || !j.result.subdomain) process.exit(1);
              process.stdout.write(j.result.subdomain);
            });
          ')

          BASE_URL="https://liefantidia2-ai-router.${SUBDOMAIN}.workers.dev"
          ENDPOINT="${BASE_URL}/generate-recipe"

          for i in 1 2 3 4 5 6; do
            if curl -fsS "${BASE_URL}/health" >/dev/null; then
              break
            fi
            if [ "$i" -eq 6 ]; then
              echo "Worker health check failed" >&2
              exit 1
            fi
            sleep 5
          done

          echo "endpoint=${ENDPOINT}" >> "$GITHUB_OUTPUT"
          echo "### AI Router" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: ${BASE_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "Android endpoint: ${ENDPOINT}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployed API and live recipe/history flow
        env:
          SMOKE_BASE_URL: ${{ steps.worker.outputs.endpoint }}
        run: |
          export SMOKE_BASE_URL="${SMOKE_BASE_URL%/generate-recipe}"
          node scripts/live-smoke.mjs

      - name: 8. JDK 17をセットアップ
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 9. Android SDKをセットアップ
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'

      - name: 10. 使用可能なAPKをビルド
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew clean testDebugUnitTest assembleDebug \
            -PAI_PROXY_URL="${{ steps.worker.outputs.endpoint }}" \
            --no-daemon --stacktrace --max-workers=2

      - name: 11. APKをアップロード
        uses: actions/upload-artifact@v4
        with:
          name: liefantidia2-cloud-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
