name: APK Java デバッグビルド

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SKIP_JDK_VERSION_CHECK: true

    steps:
      - name: 1. リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: 2. JDK 17をセットアップ
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 3. Android SDKのセットアップ
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: 4. gradlewに実行権限を付与
        run: chmod +x ./gradlew

      - name: 5. デバッグAPKのビルド
        run: |
          echo "デバッグAPKをビルドします。"
          ./gradlew clean assembleDebug --no-daemon --stacktrace --max-workers=2

      - name: 6. 成果物(APK)のアップロード
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
