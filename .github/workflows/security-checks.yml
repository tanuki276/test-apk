name: Worker and Firestore checks
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: cloudflare-worker
      - run: npm test
        working-directory: cloudflare-worker
      - run: node --check src/index.js && node --check src/budget.js
        working-directory: cloudflare-worker
  firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: tests/firestore
      - run: npx firebase emulators:exec --project demo-cookai --only auth,firestore --config ../../firebase.json 'npm test'
        working-directory: tests/firestore
